<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d121f;
            --card: #13131b;
            --border: rgba(255,255,255,0.08);
            --text: #ffffff;
            --sub: #8b96b0;
            --purple: #9f7cff;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 12px;
            overflow-x: hidden;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }
        .full { grid-column: span 2; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .title { font-size: 13px; font-weight: 700; color: var(--purple); letter-spacing: 0.8px; display: flex; align-items: center; gap: 8px; }
        .badge { background: rgba(159,124,255,0.1); color: var(--purple); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; }
        canvas { max-width: 100%; height: 260px !important; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #1e1e2d; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">
            <div class="card-header">
                <div class="title">👥 USERS BY ROLE</div>
                <div class="badge">SYSTEM STATUS</div>
            </div>
            <canvas id="roleChart"></canvas>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="title">🛡️ 2FA PROTECTION</div>
                <div class="badge">SECURITY</div>
            </div>
            <canvas id="twoFaChart"></canvas>
        </div>

        <div class="card full">
            <div class="card-header">
                <div class="title">🚀 LOGIN ATTEMPTS (TREND)</div>
            </div>
            <canvas id="loginChart"></canvas>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="title">💬 MESSAGES PER DAY</div>
            </div>
            <canvas id="messageChart"></canvas>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="title">🔔 NOTIFICATIONS BY TYPE</div>
            </div>
            <canvas id="notifChart"></canvas>
        </div>
    </div>

    <script>
        let charts = {};

        const defaults = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#8b96b0', font: { size: 11, weight: '600' }, usePointStyle: true, padding: 15 } }
            },
            scales: {
                x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#666', font: { size: 10 } } },
                y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#666', font: { size: 10 }, stepSize: 1 } }
            }
        };

        window.updateCharts = (data) => {
            try {
                if (typeof data === 'string') data = JSON.parse(data);
                console.log("Updating charts with data:", data);
                
                if (!window.Chart) {
                    console.error("Chart.js not loaded. Retrying in 1s...");
                    setTimeout(() => window.updateCharts(data), 1000);
                    return;
                }

                updateBarChart('roleChart', data.roles.labels, data.roles.values, '#10b981');
                updateDoughnutChart('twoFaChart', ['Enabled', 'Disabled'], [data.twoFa.enabled, data.twoFa.disabled], ['#10b981', '#3b4151']);
                updateLineChart('loginChart', data.logins.labels, data.logins.success, data.logins.failure);
                updateAreaChart('messageChart', data.messages.labels, data.messages.values, '#3b82f6');
                updatePieChart('notifChart', data.notifs.labels, data.notifs.values);
            } catch (e) {
                console.error("Error updating charts:", e);
            }
        };

        function updateBarChart(id, labels, values, color) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Users', data: values, backgroundColor: color, borderRadius: 8, barThickness: 30 }]
                },
                options: defaults
            });
        }

        function updateDoughnutChart(id, labels, values, colors) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
                options: { ...defaults, cutout: '75%', plugins: { ...defaults.plugins, legend: { position: 'bottom' } } }
            });
        }

        function updateLineChart(id, labels, success, failure) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Success', data: success, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.4, pointRadius: 3 },
                        { label: 'Failure', data: failure, borderColor: '#ef4444', borderDash: [5, 5], tension: 0.4, pointRadius: 0 }
                    ]
                },
                options: defaults
            });
        }

        function updateAreaChart(id, labels, values, color) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Messages', data: values, borderColor: color, backgroundColor: color + '22', fill: true, tension: 0.4 }]
                },
                options: defaults
            });
        }

        function updatePieChart(id, labels, values) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'pie',
                data: { labels: labels, datasets: [{ data: values, backgroundColor: ['#9f7cff', '#3b82f6', '#10b981', '#f59e0b', '#ef4444'], borderWidth: 0 }] },
                options: { ...defaults, plugins: { ...defaults.plugins, legend: { position: 'right' } } }
            });
        }
    </script>
</body>
</html>
